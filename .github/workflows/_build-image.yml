name: Build and push image

# Reusable single-service build. Called once per changed service from
# deploy.yml so only affected images are rebuilt.

on:
  workflow_call:
    inputs:
      service:
        description: Human-readable service name (used in the job summary).
        required: true
        type: string
      context:
        description: Docker build context.
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root.
        required: true
        type: string
      image:
        description: Image name below ghcr.io/<owner>/<repo>/.
        required: true
        type: string
      public_strapi_url:
        description: Value for the PUBLIC_STRAPI_URL build arg (server only).
        required: false
        type: string
        default: ''
      strapi_admin_url:
        description: Value for the STRAPI_ADMIN_URL build arg (server only).
        required: false
        type: string
        default: ''
      next_public_strapi_url:
        description: Value for the NEXT_PUBLIC_STRAPI_URL build arg (web only).
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  # Keep these in sync with _mirror-images.yml and the ARG defaults in the
  # Dockerfiles.
  NODE_VERSION: 22-alpine
  PYTHON_VERSION: 3.12-slim
  # Keep this in sync with BUILDKIT_VERSION in _mirror-images.yml.
  BUILDKIT_VERSION: v0.34.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase repository name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >>"$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull explicitly so the Buildx bootstrap below reuses the local image
      # instead of resolving it again. This is what keeps CI off public
      # registries.
      - name: Pull mirrored BuildKit
        run: |
          image="${REGISTRY}/${IMAGE_NAME}/mirror/buildkit:${BUILDKIT_VERSION}"
          if ! docker pull "$image"; then
            echo "::error::Missing $image. Run the 'Mirror upstream images to GHCR' workflow first."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mirror/buildkit:${{ env.BUILDKIT_VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ inputs.image }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ inputs.image }}:${{ github.sha }}
          # Keep these as single-line inputs. GitHub passes multiline reusable-
          # workflow inputs with CRLF line endings; mixing those with the LF
          # lines below makes the action's CSV parser merge the last arguments
          # (NODE_IMAGE swallowed PYTHON_IMAGE).
          build-args: |
            PUBLIC_STRAPI_URL=${{ inputs.public_strapi_url }}
            STRAPI_ADMIN_URL=${{ inputs.strapi_admin_url }}
            NEXT_PUBLIC_STRAPI_URL=${{ inputs.next_public_strapi_url }}
            NODE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mirror/node:${{ env.NODE_VERSION }}
            PYTHON_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mirror/python:${{ env.PYTHON_VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ inputs.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ inputs.image }}:buildcache,mode=max

      - name: Write job summary
        run: |
          {
            echo "### Built: ${{ inputs.service }}"
            echo ""
            echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ inputs.image }}:${{ github.sha }}\`"
            echo "- Also tagged: \`latest\`"
          } >>"$GITHUB_STEP_SUMMARY"
